<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Story Creator</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body class="bg-gray-100 text-gray-900">
    <!-- Navbar -->
    <nav class="bg-blue-600 p-4 text-white fixed w-full top-0 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Story Creator</h1>
            <ul class="flex space-x-6">
                <li><a href="#section1" class="hover:underline">Create</a></li>
                <li><a href="#section2" class="hover:underline">Publish</a></li>
                <li><a href="#section3" class="hover:underline">View Story</a></li>
            </ul>
        </div>
    </nav>
    
    <!-- Sections -->
<section id="section1" class="h-screen flex flex-col items-center justify-center bg-white p-6">
    <h2 class="text-4xl font-semibold">Create Your Story</h2>
    <p class="mt-4">Use our interactive tools to craft your own unique narrative.</p>
    <div class="mt-6 space-y-4">
        <textarea id="story-text" class="w-3/4 p-2 border rounded" rows="5" placeholder="Write your story here..."></textarea>
        <input type="file" id="image-upload" accept="image/*" class="block">
        <input type="file" id="music-upload" accept="audio/*" class="block mt-2" title="Upload Background Music">
        <input type="text" id="caption" class="w-3/4 p-2 border rounded mt-2" placeholder="Add a caption...">
        <input type="date" id="story-date" class="p-2 border rounded mt-2">
        <input type="time" id="story-time" class="p-2 border rounded mt-2">
        <select id="story-effects" class="p-2 border rounded mt-2">
            <option value="none">No Effect</option>
            <option value="fade">Fade In</option>
            <option value="slide">Slide In</option>
            <option value="zoom">Zoom In</option>
        </select>
        <div id="image-preview" class="mt-4">
            <!-- Image preview and delete button will be inserted here -->
        </div>
    </div>
</section>

<section id="section2" class="h-screen flex items-center justify-center bg-gray-200 p-6">
    <div class="text-center">
        <h2 class="text-4xl font-semibold">Publish & Share</h2>
        <p class="mt-4">Once your story is ready, publish it for others to enjoy!</p>
        <button id="publish-btn" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded">Publish Story</button>
        <!-- Output area for success message -->
        <p id="publish-status" class="mt-4 text-xl text-green-600 hidden"></p>
    </div>
</section>

<script>
    const imageInput = document.getElementById('image-upload');
    const imagePreview = document.getElementById('image-preview');
    const storyEffects = document.getElementById('story-effects');
    const publishButton = document.getElementById('publish-btn');
    const publishStatus = document.getElementById('publish-status');

    // Function to handle the image upload
    imageInput.addEventListener('change', handleImageUpload);
    
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                // Create an image element and set the source
                const imgElement = document.createElement('img');
                imgElement.src = e.target.result;
                imgElement.classList.add('w-full', 'rounded-lg', 'shadow-lg');
                imgElement.setAttribute('id', 'uploaded-image');
                
                // Clear any existing image preview
                imagePreview.innerHTML = '';
                imagePreview.appendChild(imgElement);

                // Create and add a delete button
                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Delete Image';
                deleteButton.classList.add('mt-2', 'bg-red-500', 'text-white', 'px-4', 'py-2', 'rounded');
                deleteButton.addEventListener('click', deleteImage);
                imagePreview.appendChild(deleteButton);

                // Apply effect based on dropdown selection
                storyEffects.addEventListener('change', applyEffect);

                function applyEffect() {
                    imgElement.classList.remove('fade', 'slide', 'zoom'); // Remove all effects
                    if (storyEffects.value !== 'none') {
                        imgElement.classList.add(storyEffects.value);
                    }
                }
            };
            reader.readAsDataURL(file);
        }
    }

    // Function to delete the uploaded image
    function deleteImage() {
        imagePreview.innerHTML = ''; // Clear the image and delete button
    }

    // Function to handle the publishing action
    publishButton.addEventListener('click', function() {
        // Display a success message
        publishStatus.textContent = 'Your story has been published successfully!';
        publishStatus.classList.remove('hidden'); // Show the success message
    });
</script>

<section id="section3" class="h-screen flex flex-col items-center justify-center bg-gray-100 p-6">
    <h2 class="text-4xl font-semibold">View Your Story</h2>
    <div id="view-story" class="w-3/4 bg-white p-6 mt-6 border rounded-lg shadow-md hidden">
        <p id="view-story-text" class="text-lg"></p>
        <p id="view-story-caption" class="mt-2 text-sm text-gray-600"></p>
        <p id="view-story-date-time" class="mt-2 text-sm text-gray-600"></p>
        <div id="view-story-image" class="mt-4"></div>
        <button id="delete-story-btn" class="mt-4 bg-red-600 text-white px-4 py-2 rounded">Delete Story</button>
    </div>
</section>

<script>
    const viewStorySection = document.getElementById('view-story');
    const viewStoryText = document.getElementById('view-story-text');
    const viewStoryCaption = document.getElementById('view-story-caption');
    const viewStoryDateTime = document.getElementById('view-story-date-time');
    const viewStoryImage = document.getElementById('view-story-image');
    const deleteStoryButton = document.getElementById('delete-story-btn');

    let storyData = JSON.parse(localStorage.getItem('storyData')) || {};

    document.getElementById('publish-btn').addEventListener('click', function () {
        storyData = {
            text: document.getElementById('story-text').value,
            image: document.getElementById('uploaded-image') ? document.getElementById('uploaded-image').src : '',
            caption: document.getElementById('caption').value,
            date: document.getElementById('story-date').value,
            time: document.getElementById('story-time').value,
        };

        localStorage.setItem('storyData', JSON.stringify(storyData));
        displayStory();
    });

    function displayStory() {
        let storyData = JSON.parse(localStorage.getItem('storyData')) || {};

        if (storyData.text || storyData.image) {
            viewStoryText.textContent = storyData.text;
            viewStoryCaption.textContent = storyData.caption ? `Caption: ${storyData.caption}` : '';
            viewStoryDateTime.textContent = storyData.date && storyData.time ? `Date: ${storyData.date}, Time: ${storyData.time}` : '';

            viewStoryImage.innerHTML = '';
            if (storyData.image) {
                const imgElement = document.createElement('img');
                imgElement.src = storyData.image;
                imgElement.classList.add('w-full', 'rounded-lg', 'shadow-lg');
                viewStoryImage.appendChild(imgElement);
            }
            viewStorySection.classList.remove('hidden');
        }
    }

    deleteStoryButton.addEventListener('click', function () {
        if (confirm("Are you sure you want to delete this story?")) {
            localStorage.removeItem('storyData');
            viewStorySection.classList.add('hidden');
            alert("Story deleted successfully.");
        }
    });

    window.onload = displayStory;
</script>
